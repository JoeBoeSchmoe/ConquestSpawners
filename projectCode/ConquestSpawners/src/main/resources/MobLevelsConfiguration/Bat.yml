#########################################
# 🦇 Bat Spawner Configuration
# Overrides and custom values for Bat-type spawners
#########################################

# If false, Bat spawners won't work or be placeable
Spawner-Enabled: true

# If false, uses global whitelist from config.yml
Custom-Whitelisted-Worlds: false
Worlds:
  - world
  - world_nether
  - world_the_end
  - OtherWorld

# Distance from player required to keep spawner active
Player-Activation-Range: default

# If true, disables AI on spawned mobs (recommended for performance)
Disable-Mob-AI: default

# If true, disables collisions on spawned mobs (recommended to reduce entity lag)
Disable-Collisions: default

# Radius around the spawner to search for valid spawn positions (blocks)
Spawn-Radius: default

# Maximum number of this mob’s spawners allowed per chunk
Allowed-Spawners-Per-Chunk: default

#########################################
# ✏️ Display Overrides
#########################################

OverrideDefaultDisplay: false
DisplayName: "<white><bold>[<gold>Bat Spawner</gold><white>]</bold> <white><bold>Level {level}</bold>"
DisplayLore:
  - "<gray>Collect me with Silk Touch!"
  - "<gray>Eerie loot awaits..."
IsEnchanted: true

OverrideDefaultHologramDisplay: false
HologramDisplayLines:
  - "<white><bold><gold>Bat Spawner</gold> <white>Lv.{level}</bold>"
  - "<gray>✨ Spawns fluttering night dwellers!"
  - "<gray>🪙 XP: <yellow>{xp}   ⏱ Delay: <yellow>{delay}"
HologramVerticalOffset: 1.8
HologramSpacing: 0.3
HologramDisplayTime: 100

#########################################
# 📏 Spawner Requirements
# Conditions that must be met for the spawner to function
#########################################

SpawnerRequirements:
  Air: true                     # Requires air blocks above spawn position
  Above-Sea-Level: false        # Must be above Y=63
  Below-Sea-Level: false        # Must be below Y=63
  Above-Y-Axis: false           # Requires being above a specific Y value
  Below-Y-Axis: false           # Requires being below a specific Y value
  Darkness: false               # Requires light level < 8
  Total-Darkness: true          # Requires light level = 0
  Light: false                  # Requires light level > 8

  # Fluid check: if true, must be within one of the following fluids
  Fluid: false
  AllowedFluids:
    - LAVA
    - WATER

  # Biome restriction: requires the spawner to be in a specific biome
  InBiome: false
  # Full biome list: https://minecraft.fandom.com/wiki/Biome#List_of_biomes
  AllowedBiomes:
    - dripstone_caves
    - lush_caves
    - deep_dark

  On-Ground: false              # Requires solid block below spawn location

  # Specific block check: requires the spawner to be placed on a block in this list
  On-Block: false
  # Full block list: https://minecraft.fandom.com/wiki/Category:Blocks
  AllowedBlocks:
    - STONE
    - COBBLESTONE
    - DEEPSLATE

#########################################
# 🧱 Spawner Levels & Upgrade Paths
# Define behavior and drops for each upgrade tier
#########################################

Spawner-Levels:
  '1':
    SpawnerDelay: default
    MobCount: default
    XPDrop: default
    VanillaDrops: false
    CustomDrops:
      '1':
        Material: GLOW_INK_SAC
        Amount: 1
        Drop-Percent: 25.0
        Custom-Data: {}

  '2':
    SpawnerDelay: default
    MobCount: default
    XPDrop: default
    VanillaDrops: false
    CostToUpgrade: 1000
    CustomDrops:
      '1':
        Material: GLOW_INK_SAC
        Amount: 2
        Drop-Percent: 40.0
        Custom-Data: {}

  '3':
    SpawnerDelay: default
    MobCount: default
    XPDrop: default
    VanillaDrops: false
    CostToUpgrade: 2000
    CustomDrops:
      '1':
        Material: GLOW_INK_SAC
        Amount: 3
