#########################################
# 🌲 Creaking Spawner Configuration
# Overrides and custom values for Creaking-type spawners
#########################################

# If false, Creaking spawners won't work or be placeable
Spawner-Enabled: true

# If false, uses global whitelist from config.yml
Custom-Whitelisted-Worlds: false
Worlds:
  - world
  - world_nether
  - world_the_end
  - OtherWorld

# Distance from player required to keep spawner active (in blocks)
Player-Activation-Range: default

# If true, disables AI on spawned mobs (not recommended for creakings)
Disable-Mob-AI: default

# If true, disables collisions on spawned mobs (optional)
Disable-Collisions: default

# Radius around the spawner to search for valid spawn positions (blocks)
Spawn-Radius: default

# Maximum number of this mob’s spawners allowed per chunk
Allowed-Spawners-Per-Chunk: default

# Override name/lore display in GUI (optional)
OverrideDefaultDisplay: false
DisplayName: "<white><bold>[<dark_green>Creaking Spawner</dark_green><white>]</bold> <white><bold>Level {level}</bold>"
DisplayLore:
  - "<gray>Collect me with Silk Touch!"
  - "<gray>It moves when you don't look..."

#########################################
# 📏 Spawner Requirements
# Conditions that must be met for the spawner to function
#########################################

SpawnerRequirements:
  Air: true                     # Needs open space
  Above-Sea-Level: false
  Below-Sea-Level: false
  Above-Y-Axis: false
  Below-Y-Axis: false
  Darkness: true                # Best as a "night/forest" style mob
  Total-Darkness: false
  Light: false

  Fluid: false                  # Cannot spawn in water/lava

  InBiome: false
  AllowedBiomes:
    - dark_forest
    - forest
    - taiga
    - old_growth_pine_taiga

  On-Ground: false

  On-Block: false
  AllowedBlocks:
    - GRASS_BLOCK
    - PODZOL
    - COARSE_DIRT
    - MOSS_BLOCK
    - ROOTED_DIRT

#########################################
# 🧱 Spawner Levels & Upgrade Paths
# Define behavior and drops for each upgrade tier
#########################################

Spawner-Levels:
  '1':
    SpawnerDelay: default
    MobCount: default
    XPDrop: default
    VanillaDrops: false
    CustomDrops:
      '1':
        Material: PALE_OAK_LOG
        Amount: 1
        Drop-Percent: 40.0
        Custom-Data: {}

  '2':
    SpawnerDelay: default
    MobCount: default
    XPDrop: default
    VanillaDrops: false
    CostToUpgrade: default
    CustomDrops:
      '1':
        Material: PALE_OAK_PLANKS
        Amount: 4
        Drop-Percent: 55.0
        Custom-Data: {}

  '3':
    SpawnerDelay: default
    MobCount: default
    XPDrop: default
    VanillaDrops: false
    CostToUpgrade: default
    CustomDrops:
      '1':
        Material: PALE_OAK_SAPLING
        Amount: 1
